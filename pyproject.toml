[project]
name = "capsuleerapp"
version = "1"
dependencies = ["aiohttp-session>2.11,<3"]

[tool.isort]
profile = "black"
py_version = 311
length_sort = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = [
"I"
, "U"
, "F"
, "F401"
, "UP"
, "PYI019"
, "PYI036"
, "T100"  # no breakpoint(), pdb.set_trace()
, "ASYNC"  # asyncio antipatterns
, "DTZ"  # datetime antipatterns
, "LOG"  # logging
, "SLOT"  # enforce slots in some kinds of subclasses
, "PIE"  # prevent some redundant operations
, "RUF100"  # no unused noqa stanza
, "C4"  # unnecessary dict() calls
, "FURB"  # modernization refactorings
, "PERF"  # performance improvements
, "G"  # flake8-logging-format
, "SIM"  # combine multiple with statements
, "B028"  # warnings should have stacklevel
]
ignore = [
"S101"  # use of assert
, "SIM300"  # Yoda expressions
, "SIM105"  # prefer native syntax over contextlib.suppress
, "SIM108"  # ternary operator can harm readability
, "SIM102"  # seperate if statements help readability
, "RUF023"  # sorting __slots__
, "TRY002"  # create your own exception
]

[tool.pixi.workspace]
name = "capsuleerapp"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
capsuleerapp = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.14.*"
aiohttp = ">=3.10.8"
asyncpg = ">=0.29.0"
cryptography = ">=43.0.1"
sentry-sdk = ">=2.14.0"
nodejs = ">=24"
ruff = ">=0.6.8"
pre-commit = ">=3.8.0,<4"
pytest = ">=8.3.3"
mypy = ">=1.16.0,<2"
supervisor = ">=4.2.5"
python-jose = ">=3.5.0,<4"
